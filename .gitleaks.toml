# gitleaks configuration (CI job `security`). Extends the built-in ruleset; add allowlist entries
# ONLY for documented fake values, each with the reason it is not a secret.
title = "financial-hub"

[extend]
useDefault = true

# Test fixtures that look like credentials must be spelled fake-... / FAKE_... (any case). Both conditions
# must hold (AND): a test path AND a fake-prefixed secret. Findings in older commits are pinned by
# fingerprint in .gitleaksignore.
[[allowlists]]
description = "Fake credentials in tests, by naming convention; not real secrets"
condition = "AND"
paths = ['''^(backend/tests|frontend/src)/.*''']
regexes = ['''(?i)^fake[-_][A-Za-z0-9_.-]*$''']
