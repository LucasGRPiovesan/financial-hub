# gitleaks configuration (CI job `security`). Extends the built-in ruleset; add allowlist entries
# ONLY for documented fake values, each with the reason it is not a secret.
title = "financial-hub"

[extend]
useDefault = true

# No allowlist entries are needed today: .env.example holds dev-only defaults
# (POSTGRES_PASSWORD=financial_hub, FH_APP_DB_PASSWORD=fh_app_dev_only) that the default rules do not flag.
# Example of the required shape if one is ever needed:
#
# [[allowlists]]
# description = "Fake key used in tests/fixtures; not a real credential"
# paths = ['''backend/tests/.*''']
# regexes = ['''FAKE_EXAMPLE_KEY_[A-Z0-9]+''']
