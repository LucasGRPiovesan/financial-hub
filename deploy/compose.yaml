name: financial-hub

# DB credentials (ADR-0003 addendum): the owner/migration login (POSTGRES_*) reaches only `migrate`
# and the opt-in `test` service. `api` and `worker` connect as `fh_app` (no DDL, no UPDATE/DELETE on
# ledger rows); its password comes from FH_APP_DB_PASSWORD (.env) and is never hard-coded here.
x-owner-database-url: &owner-database-url postgresql+psycopg://${POSTGRES_USER:-financial_hub}:${POSTGRES_PASSWORD:-financial_hub}@db:5432/${POSTGRES_DB:-financial_hub}
x-app-database-url: &app-database-url postgresql+psycopg://fh_app:${FH_APP_DB_PASSWORD:?set FH_APP_DB_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-financial_hub}
x-backend-env: &backend-env
  FH_APP_ENV: ${FH_APP_ENV:-dev}
  FH_LOG_LEVEL: ${FH_LOG_LEVEL:-INFO}
  # Empty disables export. The `lgtm` stack is opt-in (profile `observability`, docs/DEVELOPMENT.md).
  FH_OTEL_EXPORTER_OTLP_ENDPOINT: ${FH_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  FH_OTEL_SERVICE_NAME: financial-hub-api
  # Secrets at rest and the API key pepper (docs/SECURITY.md); empty = dev defaults / disabled.
  FH_ENCRYPTION_KEYS: ${FH_ENCRYPTION_KEYS:-}
  FH_API_KEY_PEPPER: ${FH_API_KEY_PEPPER:-}

services:
  db:
    image: postgres:18
    # Dev/test tuning only: commits return before the WAL flush (a crash may lose the last few
    # transactions, never corrupts). Production settings live with the deployment, not here.
    command: ["postgres", "-c", "synchronous_commit=off", "-c", "checkpoint_timeout=15min", "-c", "shared_buffers=256MB"]
    cpus: 2
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_hub}
      POSTGRES_DB: ${POSTGRES_DB:-financial_hub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: financial-hub-backend:dev
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      FH_DATABASE_URL: *owner-database-url
      # Read by migration 0001 to set the fh_app login password (never stored in the migration).
      FH_APP_DB_PASSWORD: ${FH_APP_DB_PASSWORD:?set FH_APP_DB_PASSWORD in .env (see .env.example)}
    volumes: &backend-volumes
      - ../backend:/app
      - backend-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      target: dev
    image: financial-hub-backend:dev
    environment:
      <<: *backend-env
      FH_DATABASE_URL: *app-database-url
      FH_DEMO_LOGIN: "true" # dev only: password-less operator picker (docs/SECURITY.md)
    ports:
      - "${API_PORT:-8000}:8000"
    cpus: 1.5
    mem_limit: 1g
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    image: financial-hub-backend:dev
    pull_policy: never
    command: ["python", "-m", "financial_hub.workers"]
    environment:
      <<: *backend-env
      FH_DATABASE_URL: *app-database-url
      FH_OTEL_SERVICE_NAME: financial-hub-worker
    volumes: *backend-volumes
    cpus: 1
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.heartbeat') < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s

  # Opt-in (`docker compose run --rm test pytest`): never started by `up`. Owner credentials for
  # fixtures and DDL; FH_APP_TEST_DATABASE_URL lets ledger tests prove the fh_app privileges.
  test:
    image: financial-hub-backend:dev
    pull_policy: never
    profiles: ["test"]
    command: ["pytest"]
    # Bounded so a full suite never starves the host; scripts/test.sh also runs one suite at a time.
    cpus: 3
    mem_limit: 2g
    environment:
      <<: *backend-env
      FH_DATABASE_URL: *owner-database-url
      FH_APP_TEST_DATABASE_URL: *app-database-url
      FH_OTEL_EXPORTER_OTLP_ENDPOINT: ""
      # Hermetic tests: never the developer's local secrets (tests set their own).
      FH_ENCRYPTION_KEYS: ""
      FH_API_KEY_PEPPER: ""
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: ../frontend
      target: dev
    image: financial-hub-web:dev
    environment:
      API_PROXY_TARGET: http://api:8000
      # Bind mounts from a Windows drive deliver no inotify events, so Vite polls; keep it slow.
      VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-1000}
    cpus: 1.5
    mem_limit: 1g
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Opt-in end-to-end suite (Playwright, `scripts/e2e.sh`): never started by `up`. Shares the `web`
  # network namespace, so the browser reaches the console at http://localhost:5173 (Vite only accepts
  # localhost-style Host headers) and the API through its /v1 proxy. Keep the image tag equal to the
  # @playwright/test version pinned in e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    pull_policy: missing
    profiles: ["e2e"]
    network_mode: "service:web"
    ipc: host
    working_dir: /e2e
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund && exec npx playwright \"$$@\"", "--"]
    command: ["test"]
    environment:
      CI: ${CI:-}
      E2E_BASE_URL: http://localhost:5173
    cpus: 2
    mem_limit: 2g
    volumes:
      - ../e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"

  # Opt-in (about 0.7 GB RAM idle): COMPOSE_PROFILES=observability plus
  # FH_OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 in .env, then `docker compose up -d`.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: ["observability"]
    cpus: 1.5
    mem_limit: 1536m
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

volumes:
  db-data:
  backend-venv:
  web-node-modules:
  e2e-node-modules:
  lgtm-data:
